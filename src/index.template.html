<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-100 | Microsoft Cybersecurity Architect</title>
<meta name="description" content="Course companion for SC-100, built from the official skills measured, with every reference link verified on each build.">
<style>
:root{
  --bg:#07090c; --panel:#0d1117; --panel2:#11161d; --raise:#161c25; --sunk:#05070a;
  --rule:#1c232c; --rule-hi:#2a333e;
  --ink:#e9edf2; --dim:#96a1ad; --faint:#5d6874;
  --az:#3d9df6; --ok:#3ecf8e; --new:#d98a2b; --warn:#e0685c;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --ar:"SF Arabic","Segoe UI","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --lift:inset 0 1px 0 rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.6;letter-spacing:-0.005em;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
html[dir="rtl"] body{font-family:var(--ar);line-height:1.85;letter-spacing:normal}
a{color:inherit}button{font-family:inherit}
.w{max-width:1060px;margin:0 auto;padding:0 20px}

/* Masthead */
.top{border-bottom:1px solid var(--rule);background:rgba(7,9,12,.94);
     backdrop-filter:blur(10px);position:sticky;top:0;z-index:60}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 0}
.sig{width:33px;height:33px;flex:none;border-radius:8px;display:grid;place-items:center;
     background:linear-gradient(150deg,var(--az),#1c62ad);color:#03121f;
     font-family:var(--mono);font-size:11.5px;font-weight:700;box-shadow:var(--lift)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14.5px;font-weight:650;line-height:1.25}
.nm span{display:block;font-size:11px;color:var(--faint)}
.lang{background:transparent;border:1px solid var(--rule-hi);color:var(--dim);
      padding:5px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:600}
.lang:hover{border-color:var(--az);color:var(--az)}

/* Compact header: one line, then the provenance strip. */
.head{padding:20px 0 14px}
.head h1{font-size:19px;font-weight:650;letter-spacing:-0.02em;line-height:1.3}
html[dir="rtl"] .head h1{letter-spacing:normal;line-height:1.5}
.strip{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;align-items:center}
.chip{font-size:11.5px;font-family:var(--mono);color:var(--dim);background:var(--panel2);
      border:1px solid var(--rule);border-radius:6px;padding:3px 9px;white-space:nowrap;
      display:inline-flex;align-items:baseline;gap:6px}
html[dir="rtl"] .chip{font-family:var(--ar);font-size:12.5px}
.chip b{color:var(--ink);font-weight:650}
.chip.live{color:var(--ok);border-color:#15402f;background:#06211700}
.chip a{color:var(--az);text-decoration:none}
.chip a:hover{text-decoration:underline}
.alert{margin-top:10px;background:#241a0a;border:1px solid #5c4415;border-radius:9px;
       padding:10px 12px;font-size:12.8px;color:#e3b96a;line-height:1.55}
html[dir="rtl"] .alert{font-size:13.5px;line-height:1.78}
.alert b{color:var(--new)}

/* Sticky control bar: search, view, progress. */
.bar{position:sticky;top:54px;z-index:50;background:var(--bg);
     border-bottom:1px solid var(--rule);padding:10px 0}
.q{width:100%;background:var(--panel2);border:1px solid var(--rule-hi);color:var(--ink);
   padding:9px 13px;border-radius:9px;font-size:14px;font-family:inherit}
.q:focus{outline:none;border-color:var(--az)}
.q::placeholder{color:var(--faint)}
.row2{display:flex;gap:8px;margin-top:8px;align-items:center}
.views{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.vb{background:transparent;border:1px solid var(--rule);color:var(--dim);padding:5px 11px;
    border-radius:7px;cursor:pointer;font-size:12.5px;white-space:nowrap;
    display:inline-flex;align-items:baseline;gap:6px}
.vb:hover{color:var(--ink);border-color:var(--rule-hi)}
.vb.on{background:var(--az);border-color:var(--az);color:#03121f;font-weight:650}
.vb u{text-decoration:none;font-family:var(--mono);font-size:10.5px;opacity:.7}
.prog{margin-inline-start:auto;flex:none;display:flex;align-items:center;gap:8px;font-size:11.5px;
      color:var(--faint);font-family:var(--mono);white-space:nowrap}
html[dir="rtl"] .prog{font-family:var(--ar);font-size:12.5px}
.ptrack{width:76px;height:5px;background:var(--raise);border-radius:99px;overflow:hidden}
.pfill{height:100%;background:var(--ok);border-radius:99px;transition:width .25s}

/* Domain */
.dom{margin-top:22px}
.dom-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;
       border-bottom:1px solid var(--rule-hi)}
.dom-h b{font-size:16px;font-weight:660}
.wt{font-family:var(--mono);font-size:11.5px;color:var(--az);border:1px solid #1c4a75;
    background:#08202f;padding:2px 9px;border-radius:99px;margin-inline-start:auto}
.dom>p{color:var(--dim);font-size:13.3px;margin-top:9px;max-width:76ch}
html[dir="rtl"] .dom>p{line-height:1.8;font-size:14px}

/* Topic, collapsible */
.topic{background:linear-gradient(168deg,var(--panel2),var(--panel));border:1px solid var(--rule);
       border-radius:11px;margin-top:9px;box-shadow:var(--lift);overflow:hidden}
.topic.done{opacity:.62}
.t-h{display:flex;align-items:flex-start;gap:11px;padding:12px 14px}
.t-h:hover{background:var(--raise)}
.t-open{flex:1;min-width:0;display:flex;align-items:flex-start;gap:11px;background:none;
        border:0;padding:0;text-align:start;color:inherit;cursor:pointer;font:inherit}
.tick{width:22px;height:22px;flex:none;border-radius:5px;border:1px solid var(--rule-hi);
      background:var(--sunk);display:grid;place-items:center;margin-top:0;cursor:pointer;padding:0}
.tick:hover{border-color:var(--ok)}
.tick:focus-visible,.t-open:focus-visible{outline:2px solid var(--az);outline-offset:2px}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick svg{width:12px;height:12px;display:none}
.tick.on svg{display:block}
.t-m{flex:1;min-width:0}
.t-m b{display:block;font-size:14.2px;font-weight:645;line-height:1.4}
.t-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.tag{font-size:10.5px;font-family:var(--mono);padding:2px 7px;border-radius:5px;
     border:1px solid var(--rule-hi);color:var(--faint);white-space:nowrap}
html[dir="rtl"] .tag{font-family:var(--ar);font-size:11.5px}
.tag.day{color:var(--az);border-color:#1c4a75}
.tag.chg{color:var(--new);border-color:#5c4415;background:#211809}
.caret{flex:none;color:var(--faint);font-family:var(--mono);font-size:13px;margin-top:2px;
       transition:transform .18s}
.topic.open .caret{transform:rotate(90deg)}
html[dir="rtl"] .topic.open .caret{transform:rotate(-90deg)}
.t-b{display:none;padding:0 14px 14px;border-top:1px solid var(--rule)}
.topic.open .t-b{display:block}
.lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
     margin:13px 0 5px;font-weight:650}
html[dir="rtl"] .lbl{letter-spacing:normal;text-transform:none;font-size:12px}
.t-b ul{list-style:none}
.t-b li{position:relative;padding-inline-start:15px;color:var(--dim);font-size:13.1px;
        line-height:1.55;margin-bottom:4px}
.t-b li::before{content:"";position:absolute;inset-inline-start:3px;top:9px;width:4px;height:4px;
                border-radius:99px;background:var(--rule-hi)}
.chg-box{background:#1d1607;border:1px solid #4c3912;border-radius:8px;padding:10px 12px;
         margin-top:9px}
.chg-box b{display:block;font-size:12.6px;color:var(--new);font-weight:650}
.chg-box p{color:#cfa75f;font-size:12.6px;line-height:1.55;margin-top:3px}
html[dir="rtl"] .chg-box p{line-height:1.78;font-size:13.3px}
.chg-box div+div{margin-top:8px;padding-top:8px;border-top:1px solid #3a2c0e}
.trap{margin-top:11px;background:#241312;border:1px solid #5c2320;border-radius:8px;
      padding:10px 12px;font-size:12.7px;color:#e5948a;line-height:1.55}
html[dir="rtl"] .trap{font-size:13.4px;line-height:1.78}
.trap i{font-style:normal;font-weight:670;color:var(--warn)}
.links{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.links a{font-family:var(--mono);font-size:10.5px;color:var(--az);text-decoration:none;
         border:1px solid #1c4a75;padding:2px 8px;border-radius:5px;overflow-wrap:anywhere}
.links a:hover{background:#08202f}

/* Agenda */
.day{background:linear-gradient(168deg,var(--panel2),var(--panel));border:1px solid var(--rule);
     border-radius:11px;padding:14px 15px;margin-top:10px;box-shadow:var(--lift)}
.day-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:9px;
       border-bottom:1px solid var(--rule)}
.day-h b{font-size:15px;font-weight:655}
.day-h s{text-decoration:none;font-family:var(--mono);font-size:11px;color:var(--faint);
         margin-inline-start:auto}
.slot{display:grid;grid-template-columns:98px 1fr;gap:13px;padding:10px 0;
      border-bottom:1px solid var(--rule)}
.slot:last-child{border-bottom:0}
.slot i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--az);padding-top:2px}
.slot b{display:block;font-size:13.8px;font-weight:640}
.slot p{color:var(--dim);font-size:12.8px;line-height:1.53;margin-top:3px}
html[dir="rtl"] .slot p{line-height:1.76;font-size:13.5px}
.slot em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--faint);
         margin-inline-start:7px}

.none{color:var(--faint);padding:30px 0;font-size:14px;text-align:center}
mark{background:rgba(61,157,246,.25);color:#9fd0fb;border-radius:2px;padding:0 1px}
footer{border-top:1px solid var(--rule);margin-top:32px;padding:18px 0 38px;
       color:var(--faint);font-size:12.5px}
.fi{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fi a{color:var(--dim);text-decoration:none}
.fi a:hover{color:var(--az)}

@media(max-width:680px){
  .w{padding:0 14px}
  .head{padding:16px 0 12px}
  .head h1{font-size:17px}
  .bar{top:52px}
  .row2{flex-wrap:wrap;gap:7px}
  .views{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;margin:0 -14px;padding:0 14px 6px;
         scrollbar-width:none}
  .views::-webkit-scrollbar{display:none}
  .vb{flex:none}
  .prog{margin-inline-start:0;flex:1 1 100%;justify-content:flex-start}
  .ptrack{flex:1;max-width:none}
  .slot{grid-template-columns:1fr;gap:3px}
  .wt{margin-inline-start:0}
}
</style>
</head>
<body>

<header class="top"><div class="w"><div class="top-in">
  <div class="sig">SC</div>
  <div class="nm"><b id="nm"></b><span id="tg"></span></div>
  <button class="lang" id="lang" onclick="toggle()"></button>
</div></div></header>

<div class="w">
  <div class="head">
    <h1 id="h1"></h1>
    <div class="strip" id="strip"></div>
    <div id="alert"></div>
  </div>
</div>

<div class="bar"><div class="w">
  <input class="q" id="q" oninput="render()" autocomplete="off" spellcheck="false">
  <div class="row2"><div class="views" id="views"></div><span class="prog" id="prog"></span></div>
</div></div>

<div class="w"><div id="out"></div></div>

<footer><div class="w"><div class="fi">
  <span id="f1"></span>
  <span><a href="https://github.com/SiteQ8/SC-100" id="f2"></a></span>
</div></div></footer>

<script>
const C = /*__COURSE__*/null;

const T = {
 en:{nm:"SC-100",tg:"Microsoft Cybersecurity Architect",btn:"العربية",
  h1:"Every objective on the current exam, what changed, and where students trip.",
  q:"Search objectives, teaching points, traps",
  vAll:"All objectives",vChg:"Only what changed",vAgenda:"Agenda",
  asOf:"Blueprint",checked:"checked",pass:"Pass mark",guide:"Official study guide",
  verified:"links verified",
  zt:"Several widely read study sites still describe a domain called Design a Zero Trust strategy and architecture at 30 to 35 percent. That domain no longer exists. Zero Trust is now taught inside the first domain as a lens.",
  past:"Built for a delivery that has finished. It stays useful as a study reference, and the blueprint above is current.",
  ref:"study reference",
  teach:"What to teach",trap:"Where students go wrong",read:"Reading",changed:"Changed in 2026",
  mark:"Mark as covered",
  day:"Day",sess:"session",progress:"covered",
  none:"Nothing matches that search.",
  f1:"Reference links verified on every build.",f2:"github.com/SiteQ8/SC-100"},
 ar:{nm:"إس سي ١٠٠",tg:"مهندس الأمن السيبراني من مايكروسوفت",btn:"English",
  h1:"كل أهداف الاختبار الحالي، وما تغيّر فيها، ومواضع خطأ الطلبة.",
  q:"ابحث في الأهداف ونقاط التدريس والأخطاء",
  vAll:"كل الأهداف",vChg:"ما تغيّر فقط",vAgenda:"الجدول",
  asOf:"المخطط",checked:"فُحص",pass:"درجة النجاح",guide:"دليل الدراسة الرسمي",
  verified:"رابطا متحققا",
  zt:"ما زالت مواقع دراسة واسعة الانتشار تصف مجالا باسم تصميم استراتيجية الثقة الصفرية بوزن ثلاثين إلى خمسة وثلاثين بالمئة، وذلك المجال لم يعد موجودا، وتُدرَّس الثقة الصفرية الآن داخل المجال الأول عدسةً.",
  past:"بُني لتقديم انتهى، وهو يبقى نافعا مرجعا للدراسة، والمخطط أعلاه محدَّث.",
  ref:"مرجع دراسة",
  teach:"ما يُدرَّس",trap:"موضع خطأ الطلبة",read:"القراءة",changed:"تغيّر في ٢٠٢٦",
  mark:"علّمه مغطى",
  day:"اليوم",sess:"الجلسة",progress:"مغطّى",
  none:"لا شيء يطابق البحث.",
  f1:"تُتحقق الروابط المرجعية في كل بناء.",f2:"github.com/SiteQ8/SC-100"}
};

let lang="en", view="all", open={}, done={};
const t=()=>T[lang], L=()=>lang==="ar";
const el=i=>document.getElementById(i);
const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>n.toLocaleString(L()?"ar-EG":"en");
const TOPICS=()=>C.domains.reduce((a,d)=>a.concat(d.topics),[]);

/* Progress is a convenience for one reader on one device. It must never be
   required: the page renders identically when storage is unavailable. */
function loadDone(){
  try{ done=JSON.parse(localStorage.getItem("sc100.done")||"{}")||{}; }
  catch(e){ done={}; }
}
function saveDone(){
  try{ localStorage.setItem("sc100.done",JSON.stringify(done)); }catch(e){}
}

function toggle(){
  lang=lang==="en"?"ar":"en";
  document.documentElement.lang=lang;
  document.documentElement.dir=L()?"rtl":"ltr";
  paint();render();
}
function setView(v){view=v;render();paintBar();}
function toggleTopic(id){open[id]=!open[id];render();}
function toggleDone(id,ev){
  ev.stopPropagation();
  done[id]=!done[id];saveDone();render();paintBar();
}

function paint(){
  const s=t();
  document.title=s.nm+" | "+s.tg;
  el("nm").textContent=s.nm;el("tg").textContent=s.tg;el("lang").textContent=s.btn;
  el("h1").textContent=s.h1;
  el("f1").textContent=s.f1;el("f2").textContent=s.f2;
  el("q").placeholder=s.q;

  el("strip").innerHTML=
    '<span class="chip">'+s.asOf+' <b dir="ltr">'+C.source.skills_measured_as_of+'</b></span>'+
    '<span class="chip live">'+s.checked+' <b dir="ltr">'+C.source.checked+'</b></span>'+
    '<span class="chip">'+s.pass+' <b dir="ltr">'+C.source.pass_score+'</b></span>'+
    '<span class="chip"><b dir="ltr">'+C.counts.resources+'</b> '+s.verified+'</span>'+
    '<span class="chip"><a href="'+C.source.url+'" target="_blank" rel="noopener">'+s.guide+'</a></span>'+
    (C.days_until_delivery<0?'<span class="chip" title="'+esc(s.past)+'">'+s.ref+'</span>':"");

  el("alert").innerHTML='<div class="alert"><b>&#9888;</b> '+s.zt+'</div>';
  paintBar();
}

function paintBar(){
  const s=t(), all=TOPICS();
  const chg=all.filter(x=>x.changed&&x.changed.length).length;
  const n=all.filter(x=>done[x.id]).length;
  el("views").innerHTML=
    [["all",s.vAll,all.length],["changed",s.vChg,chg],["agenda",s.vAgenda,null]]
      .map(function(v){
        return '<button class="vb'+(view===v[0]?" on":"")+'" onclick="setView(\''+v[0]+'\')">'+
          v[1]+(v[2]!==null?'<u dir="ltr">'+v[2]+'</u>':"")+'</button>';
      }).join("");
  el("prog").innerHTML='<span class="ptrack"><span class="pfill" style="width:'+
      (all.length?n/all.length*100:0)+'%"></span></span>'+
      '<span dir="ltr">'+num(n)+"/"+num(all.length)+'</span> '+s.progress;
}

function hl(txt,term){
  txt=txt||"";
  if(!term)return esc(txt);
  const i=txt.toLowerCase().indexOf(term);
  if(i<0)return esc(txt);
  return esc(txt.slice(0,i))+"<mark>"+esc(txt.slice(i,i+term.length))+"</mark>"+
         esc(txt.slice(i+term.length));
}

function matches(tp,term){
  if(!term)return true;
  const hay=[tp.id,tp.title,tp.titleAr,tp.trap,tp.trapAr||""]
    .concat(tp.teach||[])
    .concat((tp.changed||[]).map(c=>c.label+" "+c.why+" "+(c.labelAr||"")+" "+(c.whyAr||"")))
    .join(" ");
  return hay.toLowerCase().indexOf(term)>-1;
}

function render(){
  const s=t(), term=el("q").value.trim().toLowerCase();
  if(view==="agenda"&&!term){el("out").innerHTML=agenda();return;}

  const out=C.domains.map(function(d){
    const rows=d.topics.filter(function(tp){
      if(view==="changed"&&!(tp.changed&&tp.changed.length))return false;
      return matches(tp,term);
    });
    if(!rows.length)return "";
    return '<section class="dom"><div class="dom-h"><b>'+(L()?d.titleAr:d.title)+
      '</b><span class="wt" dir="ltr">'+d.weight+'</span></div><p>'+
      (L()?d.framingAr:d.framing)+'</p>'+rows.map(x=>topic(x,term)).join("")+'</section>';
  }).join("");

  el("out").innerHTML=out||'<p class="none">'+s.none+'</p>';
}

function topic(tp,term){
  const s=t(), L2=L();
  // A search or the changed view opens matches, so a hit is never hidden behind a collapse.
  const isOpen=open[tp.id]||!!term||view==="changed";
  const tags=[];
  (tp.taught||[]).forEach(function(x){
    tags.push('<span class="tag day" dir="ltr">'+(L2?"":"")+s.day+" "+x.day+" &middot; "+
      s.sess+" "+x.slot+'</span>');
  });
  if(tp.changed&&tp.changed.length)
    tags.push('<span class="tag chg">'+s.changed+" ("+tp.changed.length+')</span>');
  tags.push('<span class="tag" dir="ltr">'+tp.id+'</span>');

  const body=
    '<div class="lbl">'+s.teach+'</div><ul>'+
      (tp.teach||[]).map(x=>'<li dir="ltr" style="text-align:start">'+hl(x,term)+'</li>').join("")+
    '</ul>'+
    ((tp.changed&&tp.changed.length)
      ? '<div class="lbl">'+s.changed+'</div><div class="chg-box">'+
        tp.changed.map(c=>'<div><b>'+hl(L2?c.labelAr:c.label,term)+'</b><p>'+
          hl(L2?c.whyAr:c.why,term)+'</p></div>').join("")+
        '</div>' : "")+
    '<div class="trap"><i>'+s.trap+':</i> '+hl(L2?(tp.trapAr||tp.trap):tp.trap,term)+'</div>'+
    linksFor(tp.id);

  const title=esc(L2?tp.titleAr:tp.title);
  return '<article class="topic'+(isOpen?" open":"")+(done[tp.id]?" done":"")+'">'+
    '<div class="t-h">'+
      '<button class="tick'+(done[tp.id]?" on":"")+'" type="button"'+
        ' aria-pressed="'+(done[tp.id]?"true":"false")+'"'+
        ' aria-label="'+s.mark+': '+title+'"'+
        ' onclick="toggleDone(\''+tp.id+'\',event)">'+
        '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3.5"'+
        ' stroke="#03200f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
        '</svg></button>'+
      '<button class="t-open" type="button" aria-expanded="'+(isOpen?"true":"false")+'"'+
        ' onclick="toggleTopic(\''+tp.id+'\')">'+
        '<span class="t-m"><b>'+hl(L2?tp.titleAr:tp.title,term)+'</b>'+
          '<span class="t-tags">'+tags.join("")+'</span></span>'+
        '<span class="caret" aria-hidden="true">&#9656;</span></button>'+
    '</div><div class="t-b">'+body+'</div></article>';
}

function linksFor(tid){
  const s=t(), rs=C.resources.filter(r=>r.topic===tid);
  if(!rs.length)return "";
  return '<div class="lbl">'+s.read+'</div><div class="links">'+rs.map(function(r){
    return '<a href="'+r.url+'" target="_blank" rel="noopener" dir="ltr">'+esc(r.title)+'</a>';
  }).join("")+'</div>';
}

function agenda(){
  const s=t();
  return C.agenda.map(function(d){
    return '<div class="day"><div class="day-h"><b>'+s.day+' '+d.day+' &middot; '+
      (L()?d.themeAr:d.theme)+'</b><s dir="ltr">'+d.date+'</s></div>'+
      d.sessions.map(function(x){
        const r=C.rhythm.filter(y=>y.label==="Session "+x.slot)[0];
        return '<div class="slot"><i dir="ltr">'+(r?r.from+" - "+r.to:"")+'</i><div><b>'+
          (L()?x.titleAr:x.title)+
          (x.topics.length?'<em dir="ltr">'+x.topics.join(" ")+'</em>':"")+
          '</b><p>'+(L()?x.aimAr:x.aim)+'</p></div></div>';
      }).join("")+'</div>';
  }).join("");
}

loadDone();paint();render();
</script>
</body>
</html>
